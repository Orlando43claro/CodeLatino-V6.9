<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía de Referencia CSS - CodeLatino Editor</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #f0f0f0;
      --highlight-color: #00ffd0;
      --block-bg: #1e1e1e;
      --block-border: #333;
      --header-bg: #2c2c2c;
      --button-bg: #00b894;
      --button-hover-bg: #019875;
      --accent-color: #6c5ce7;
      --css-property: #ff79c6;
      --css-value: #8be9fd;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: var(--header-bg);
      padding: 20px 0;
      border-bottom: 2px solid var(--highlight-color);
      margin-bottom: 30px;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      color: var(--highlight-color);
      font-size: 2.5rem;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.8;
    }

    .back-button {
      background: var(--button-bg);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .back-button:hover {
      background: var(--button-hover-bg);
    }

    .search-box {
      margin: 20px 0;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 20px;
      background: var(--block-bg);
      border: 1px solid var(--block-border);
      border-radius: 5px;
      color: var(--text-color);
      font-size: 1rem;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--highlight-color);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    .category-btn {
      background: var(--block-bg);
      border: 1px solid var(--block-border);
      color: var(--text-color);
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .category-btn.active, .category-btn:hover {
      background: var(--button-bg);
      color: white;
    }

    .reference-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .reference-card {
      background: var(--block-bg);
      border: 1px solid var(--block-border);
      border-radius: 8px;
      padding: 20px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .reference-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--block-border);
      padding-bottom: 10px;
    }

    .property-name {
      color: var(--css-property);
      font-weight: bold;
      font-size: 1.3rem;
      font-family: monospace;
    }

    .copy-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .card-content {
      margin-bottom: 15px;
    }

    .description {
      margin-bottom: 15px;
    }

    .syntax {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 0.9rem;
      margin: 10px 0;
      border-left: 3px solid var(--highlight-color);
    }

    .example {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 0.9rem;
      margin: 10px 0;
    }

    .example-css {
      color: var(--css-property);
    }

    .example-value {
      color: var(--css-value);
    }

    .values-list {
      margin-top: 10px;
    }

    .value-item {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
      padding: 5px;
      background: #252525;
      border-radius: 3px;
    }

    .value-name {
      color: var(--css-value);
      font-family: monospace;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding: 20px;
      border-top: 1px solid var(--block-border);
    }

    .compatibility {
      display: inline-block;
      background: #444;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.8rem;
      margin-left: 10px;
    }

    @media (max-width: 768px) {
      .reference-grid {
        grid-template-columns: 1fr;
      }
      
      .header-content {
        flex-direction: column;
        text-align: center;
        gap: 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="header-content">
        <div>
          <h1>Guía de Referencia CSS</h1>
          <p class="subtitle">CodeLatino Editor - Todas las propiedades disponibles en español</p>
        </div>
        <a href="editor.html" class="back-button">Ir al Editor</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar propiedades o valores...">
    </div>

    <div class="categories">
      <button class="category-btn active" data-category="all">Todas</button>
      <button class="category-btn" data-category="texto">Texto</button>
      <button class="category-btn" data-category="fondo">Fondo</button>
      <button class="category-btn" data-category="caja">Modelo de Caja</button>
      <button class="category-btn" data-category="flexbox">Flexbox</button>
      <button class="category-btn" data-category="grid">Grid</button>
      <button class="category-btn" data-category="posicion">Posición</button>
      <button class="category-btn" data-category="animacion">Animación</button>
    </div>

    <div class="reference-grid" id="referenceGrid">
      <!-- Las tarjetas de referencia se generarán con JavaScript -->
    </div>
  </div>

  <footer>
    <div class="container">
      <p>CodeLatino Editor - V6.9 | Guía de Referencia CSS</p>
    </div>
  </footer>

  <script>

}`,

    // Función para generar las tarjetas de referencia
    function generateReferenceCards(filteredData = cssReference) {
      const grid = document.getElementById('referenceGrid');
      
      if (filteredData.length === 0) {
        grid.innerHTML = '<div class="no-results">No se encontraron resultados para tu búsqueda.</div>';
        return;
      }
      
      grid.innerHTML = filteredData.map(item => `
        <div class="reference-card" data-category="${item.category}">
          <div class="card-header">
            <span class="property-name">${item.property}</span>
            <button class="copy-btn" data-code="${item.example}">Copiar</button>
          </div>
          <div class="card-content">
            <div class="description">
              <p>${item.description}</p>
            </div>
            <div class="syntax">
              <strong>Sintaxis:</strong><br>
              ${item.syntax}
            </div>
            <div class="example">
              <strong>Ejemplo:</strong><br>
              <span class="example-css">${item.example}</span>
            </div>
            ${item.values ? `
            <div class="values-list">
              <strong>Valores comunes:</strong>
              ${item.values.map(value => `
                <div class="value-item">
                  <span class="value-name">${value.name}</span>
                  <span>${value.description}</span>
                </div>
              `).join('')}
            </div>
            ` : ''}
          </div>
        </div>
      `).join('');
      
      // Añadir event listeners a los botones de copiar
      document.querySelectorAll('.copy-btn').forEach(button => {
        button.addEventListener('click', function() {
          const code = this.getAttribute('data-code');
          navigator.clipboard.writeText(code)
            .then(() => {
              const originalText = this.textContent;
              this.textContent = '¡Copiado!';
              setTimeout(() => {
                this.textContent = originalText;
              }, 2000);
            })
            .catch(err => {
              console.error('Error al copiar: ', err);
            });
        });
      });
    }

    // Función para filtrar por categoría
    function filterByCategory(category) {
      if (category === 'all') {
        generateReferenceCards();
      } else {
        const filtered = cssReference.filter(item => item.category === category);
        generateReferenceCards(filtered);
      }
    }

    // Función para buscar
    function searchProperties(query) {
      const filtered = cssReference.filter(item => 
        item.property.toLowerCase().includes(query.toLowerCase()) ||
        item.description.toLowerCase().includes(query.toLowerCase()) ||
        (item.values && item.values.some(value => 
          value.name.toLowerCase().includes(query.toLowerCase()) ||
          value.description.toLowerCase().includes(query.toLowerCase())
        ))
      );
      generateReferenceCards(filtered);
    }

    // Inicializar la página
    document.addEventListener('DOMContentLoaded', function() {
      // Generar tarjetas iniciales
      generateReferenceCards();
      
      // Configurar botones de categoría
      document.querySelectorAll('.category-btn').forEach(button => {
        button.addEventListener('click', function() {
          document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
          this.classList.add('active');
          filterByCategory(this.getAttribute('data-category'));
        });
      });
      
      // Configurar búsqueda
      document.getElementById('searchInput').addEventListener('input', function() {
        searchProperties(this.value);
      });
    });
  </script>
</body>
</html>
